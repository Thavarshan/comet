# Static assets only: no Worker script, SSR, or billable conversion endpoint.
name = "honeymelon-site-local"
compatibility_date = "2026-10-16"
workers_dev = false

[assets]
directory = "./out"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = false

[env.preview]
name = "honeymelon-site-preview"
workers_dev = true

[env.preview.assets]
directory = "./out"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = false

[env.production]
name = "honeymelon-site"
workers_dev = true

[env.production.assets]
directory = "./out"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = false
