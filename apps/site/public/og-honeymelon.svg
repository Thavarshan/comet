<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Honeymelon — Media conversion, made simple.</title>
  <desc id="description">Honeymelon. Free, open source media conversion for your computer.</desc>
  <rect width="1200" height="630" fill="#fff"/>
  <rect x="1" y="1" width="1198" height="628" rx="24" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="32" font-weight="600" fill="#171717">Honeymelon</text>
    <text x="600" y="270" font-size="62" font-weight="600" letter-spacing="-2" fill="#171717">Media conversion,</text>
    <text x="600" y="345" font-size="62" font-weight="600" letter-spacing="-2" fill="#171717">made simple.</text>
    <text x="600" y="425" font-size="24" fill="#525252">Video, audio and images. Your files stay on your device.</text>
    <rect x="426" y="477" width="348" height="56" rx="10" fill="#171717"/>
    <text x="600" y="513" font-size="21" font-weight="500" fill="#fafafa">Free &amp; Open Source</text>
    <text x="600" y="580" font-size="18" fill="#525252">macOS · Windows · Linux</text>
  </g>
</svg>
