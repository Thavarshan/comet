name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  security-events: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      signing: ${{ steps.policy.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Match tag to desktop version
        id: policy
        run: node scripts/validate-tag.mjs
  verify:
    needs: validate-tag
    uses: ./.github/workflows/verify.yml
    with:
      signing: ${{ fromJSON(needs.validate-tag.outputs.signing) }}
    secrets: inherit
  publish:
    needs: verify
    environment: release
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: 'honeymelon-{darwin,linux,win32}-*'
      - run: node scripts/prepare-release.mjs
      - name: Publish verified distributables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          draft_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ -n "$draft_state" && "$draft_state" != "true" ]]; then
            echo "Refusing to replace a published release"
            exit 1
          fi
          if [[ -z "$draft_state" ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
