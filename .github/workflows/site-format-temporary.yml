# Temporary formatter for one review iteration; removed before merge.
name: Format Comet site review
on:
  push:
    branches:
      - feat/69-static-next-site
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - name: Format updated site and E2E source
        run: |
          npm exec -- prettier --write apps/site packages/e2e/package.json packages/e2e/playwright.site.config.ts packages/e2e/tests/site/site.spec.ts .github/workflows/verify.yml
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site packages/e2e/package.json packages/e2e/playwright.site.config.ts packages/e2e/tests/site/site.spec.ts .github/workflows/verify.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(site): format browser QA additions"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
