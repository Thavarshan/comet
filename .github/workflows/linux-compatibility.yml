name: Linux distribution compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  distro:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - fedora:43
          - opensuse/leap:16.0
        include:
          - runner: ubuntu-24.04
            image: archlinux:base
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - name: Identify native architecture
        run: |
          echo "COMET_TARGET=linux-$(node -p process.arch)" >> "$GITHUB_ENV"
          echo "NODE_DIRECTORY=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
          echo "DISTRO_ID=$(echo '${{ matrix.image }}' | tr '/:' '--')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-payload-${{ env.COMET_TARGET }}
          path: ${{ runner.temp }}/payload
      - name: Convert media in the packaged app on this distribution
        run: |
          docker run --rm --init --shm-size=1g \
            --cap-add=SYS_ADMIN --security-opt seccomp=unconfined \
            -e CI=true -e COMET_TARGET \
            -v "$PWD:/work" \
            -v "$NODE_DIRECTORY:/node:ro" \
            -v "$RUNNER_TEMP/payload:/payload:ro" \
            '${{ matrix.image }}' bash /work/scripts/ci/linux-container.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distro-${{ env.COMET_TARGET }}-${{ env.DISTRO_ID }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
