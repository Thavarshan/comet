# Temporary P2.1 formatting and validation (removed before PR).
name: Validate P2.1 site scaffold
on:
  push:
    branches:
      - feat/69-static-next-site
permissions:
  contents: write
jobs:
  site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - name: Format static site and Turbo config
        run: npm exec -- prettier --write apps/site turbo.json
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site turbo.json
          if ! git diff --cached --quiet; then
            git commit -m "style(site): format static marketing workspace"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @comet/site
      - run: npm run build -w @comet/site
