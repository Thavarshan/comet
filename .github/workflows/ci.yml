name: CI
on:
  push:
    branches: [main, release]
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      exhaustive: ${{ github.event_name != 'pull_request' }}
  required:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete verification pipeline
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
